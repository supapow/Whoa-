services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_api_node_modules:/app/apps/api/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      # Vite >= 6.1 appends this to allowedHosts; bare passthrough per Base44 dev-mode rules
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: unless-stopped

volumes:
  web_node_modules:
  web_app_node_modules:
  web_api_node_modules:
